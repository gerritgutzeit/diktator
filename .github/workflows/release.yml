name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version from tag or csproj
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -oP '(?<=<Version>)[^<]+' src/Diktator/Diktator.csproj | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained app
        run: >
          dotnet publish src/Diktator/Diktator.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:DebugType=none
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous Velopack release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack Velopack installer
        run: >
          vpk pack
          -u Diktator
          -v ${{ steps.ver.outputs.version }}
          -p publish
          --mainExe Diktator.exe
          -i src/Diktator/Assets/app.ico
          --packTitle Diktator
          --packAuthors "Gerrit Gutzeit"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diktator-win-x64
          path: Releases/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "${{ github.ref_name }}"
          --tag ${{ github.ref_name }}
